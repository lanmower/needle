name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[test,train]"
      - run: python -m pytest -q -m "not slow"
      - run: python -m build
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  package-platform:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: windows-latest
            target: windows-arm64
          - os: macos-14
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - shell: bash
        run: |
          mkdir -p release-pkg
          needle download ${{ matrix.target }} --out release-pkg
          cd release-pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../needle-${{ matrix.target }}.zip" "${{ matrix.target }}"
          else
            tar -czf "../needle-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: needle-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release
    needs: [verify, package-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-downloads
      - run: |
          mkdir -p release-artifacts
          find release-downloads -type f -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Needle Release ${{ github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
