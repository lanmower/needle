name: publish-component

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Needle engine generation
        default: "2"
        type: choice
        options: ["2", "3"]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - id: component
        run: |
          generation="${{ github.event.inputs.generation || '2' }}"
          needle download wasm-component --generation "$generation" --out .
          version=$(python3 -c "from needle.agent import fetch; print(fetch.engine_version($generation))")
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/needle${generation}-component" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - id: push
        working-directory: wasm-component
        run: |
          image="${{ steps.component.outputs.image }}"
          version="${{ steps.component.outputs.version }}"
          digest=$(oras push "$image:$version,latest" \
            --artifact-type application/vnd.wasm.component.v1+wasm \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.title=needle.component.wasm" \
            --format go-template='{{.digest}}' \
            needle.component.wasm:application/vnd.wasm.component.v1+wasm \
            needle.wit:text/plain)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $image:$version@$digest"
      - run: cosign sign --yes "${{ steps.component.outputs.image }}@${{ steps.push.outputs.digest }}"
      - run: |
          cosign verify "${{ steps.component.outputs.image }}@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
